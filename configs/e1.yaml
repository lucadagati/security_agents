# E1 - Baseline: 1 attacker vs 1 defender, no adaptation, no communication.
name: e1_baseline
description: Static attacker vs static defender. Establishes the no-adaptation baseline.
seed: 1
episodes: 30
max_turns: 20

environment:
  backend: sim
  hosts: 3
  vulnerabilities_per_host: 2
  detection_base_rate: 0.15

interaction:
  topology: none
  communication: none
  allow_coalitions: false

agents:
  - id_prefix: attacker
    role: attacker
    count: 1
    adaptation: static
    policy: { kind: rule_based, stealth: 0.3 }
    encoded_behaviours: [reconnaissance, privilege_escalation, resource_targeting]
  - id_prefix: defender
    role: defender
    count: 1
    adaptation: static
    policy: { kind: rule_based, stealth: 0.4 }
    encoded_behaviours: [adaptive_monitoring, dynamic_isolation]
