# E3 - Interaction: 1A vs 1D, adaptive, with direct communication enabled.
name: e3_interaction
description: Adaptive agents with a direct communication channel. Tests interaction (RQ1/RQ3).
seed: 3
episodes: 30
max_turns: 20
measure_esr: true

environment:
  backend: sim
  hosts: 3
  vulnerabilities_per_host: 2
  detection_base_rate: 0.15

interaction:
  topology: static
  communication: direct
  communication_cost: 0.5
  allow_coalitions: false

agents:
  - id_prefix: attacker
    role: attacker
    count: 1
    adaptation: episodic
    policy: { kind: heuristic, stealth: 0.3 }
    encoded_behaviours: [reconnaissance, privilege_escalation, resource_targeting]
  - id_prefix: defender
    role: defender
    count: 1
    adaptation: episodic
    policy: { kind: heuristic, stealth: 0.4 }
    encoded_behaviours: [adaptive_monitoring, dynamic_isolation]
