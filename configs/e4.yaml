# E4 - Population: 3 attackers vs 3 defenders, adaptive, direct communication.
name: e4_population
description: Small populations with direct communication. Tests population effects (RQ4).
seed: 4
episodes: 25
max_turns: 25
measure_esr: true

environment:
  backend: sim
  hosts: 4
  vulnerabilities_per_host: 2
  detection_base_rate: 0.15

interaction:
  topology: static
  communication: direct
  communication_cost: 0.5
  allow_coalitions: true

agents:
  - id_prefix: attacker
    role: attacker
    count: 3
    adaptation: episodic
    policy: { kind: heuristic, stealth: 0.3 }
    encoded_behaviours: [reconnaissance, privilege_escalation, resource_targeting]
  - id_prefix: defender
    role: defender
    count: 3
    adaptation: episodic
    policy: { kind: heuristic, stealth: 0.4 }
    encoded_behaviours: [adaptive_monitoring, dynamic_isolation]
