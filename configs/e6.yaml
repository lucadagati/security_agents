# E6 - Co-evolution: 5A vs 5D, persistent cross-episode memory, graph.
name: e6_coevolution
description: Persistent-memory populations. Tests cross-episode co-evolution (RQ3, H4).
seed: 6
episodes: 40
max_turns: 30
measure_esr: true

environment:
  backend: sim
  hosts: 5
  vulnerabilities_per_host: 2
  detection_base_rate: 0.15

interaction:
  topology: graph
  communication: graph
  communication_cost: 0.5
  allow_coalitions: true

agents:
  - id_prefix: attacker
    role: attacker
    count: 5
    adaptation: persistent
    policy: { kind: heuristic, stealth: 0.3 }
    encoded_behaviours: [reconnaissance, privilege_escalation, resource_targeting]
  - id_prefix: defender
    role: defender
    count: 5
    adaptation: persistent
    policy: { kind: heuristic, stealth: 0.4 }
    encoded_behaviours: [adaptive_monitoring, dynamic_isolation]
