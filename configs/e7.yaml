# E7 - Coalition: 5A vs 5D, persistent, graph, coalitions enabled/analysed.
name: e7_coalition
description: Persistent populations with coalition detection. Tests emergent cooperation (RQ2, H6).
seed: 7
episodes: 40
max_turns: 30
measure_esr: true

environment:
  backend: sim
  hosts: 5
  vulnerabilities_per_host: 3
  detection_base_rate: 0.12

interaction:
  topology: graph
  communication: graph
  communication_cost: 0.3
  allow_coalitions: true

agents:
  - id_prefix: attacker
    role: attacker
    count: 5
    adaptation: persistent
    policy: { kind: heuristic, stealth: 0.3 }
    encoded_behaviours: [reconnaissance, privilege_escalation, resource_targeting]
  - id_prefix: defender
    role: defender
    count: 5
    adaptation: persistent
    policy: { kind: heuristic, stealth: 0.4 }
    encoded_behaviours: [adaptive_monitoring, dynamic_isolation]
