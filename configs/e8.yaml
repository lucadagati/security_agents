# E8 - Emergence: 10A vs 10D, persistent, dynamic topology.
name: e8_emergence
description: Largest populations with a dynamic interaction graph. Tests emergence at scale (RQ2, H6).
seed: 8
episodes: 40
max_turns: 35
measure_esr: true

environment:
  backend: sim
  hosts: 6
  vulnerabilities_per_host: 3
  detection_base_rate: 0.12

interaction:
  topology: dynamic
  communication: graph
  communication_cost: 0.3
  allow_coalitions: true

agents:
  - id_prefix: attacker
    role: attacker
    count: 10
    adaptation: persistent
    policy: { kind: heuristic, stealth: 0.3 }
    encoded_behaviours: [reconnaissance, privilege_escalation, resource_targeting]
  - id_prefix: defender
    role: defender
    count: 10
    adaptation: persistent
    policy: { kind: heuristic, stealth: 0.4 }
    encoded_behaviours: [adaptive_monitoring, dynamic_isolation]
