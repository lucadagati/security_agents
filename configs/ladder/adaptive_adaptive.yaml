# Ladder rung 4: both sides adapt within the episode.
name: ladder_adaptive_adaptive
description: Episodic-adaptive attacker vs episodic-adaptive defender.
seed: 100
episodes: 40
max_turns: 20
environment: { backend: sim, hosts: 3, vulnerabilities_per_host: 2, detection_base_rate: 0.15 }
interaction: { topology: none, communication: none }
agents:
  - id_prefix: attacker
    role: attacker
    adaptation: episodic
    policy: { kind: heuristic, stealth: 0.3 }
    encoded_behaviours: [reconnaissance, privilege_escalation, resource_targeting]
  - id_prefix: defender
    role: defender
    adaptation: episodic
    policy: { kind: heuristic, stealth: 0.4 }
    encoded_behaviours: [adaptive_monitoring, dynamic_isolation]
