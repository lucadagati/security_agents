# Overnight LLM B3: static LLM agents on the volume model (qwen2.5-coder:7b).
name: overnight_llm_static
description: 1A+1D static LLM (B3). Small coder 7B baseline on L40.
seed: 301
episodes: 12
max_turns: 16
output_dir: runs/overnight
environment: { backend: sim, hosts: 3, vulnerabilities_per_host: 2 }
interaction: { topology: none, communication: none }
agents:
  - id_prefix: attacker
    role: attacker
    adaptation: static
    policy: { kind: llm }
    llm:
      provider: ollama
      model: qwen2.5-coder:7b
      temperature: 0.3
      max_tokens: 256
      timeout_s: 180
    encoded_behaviours: []
    token_budget: 40000
  - id_prefix: defender
    role: defender
    adaptation: static
    policy: { kind: llm }
    llm:
      provider: ollama
      model: qwen2.5-coder:7b
      temperature: 0.3
      max_tokens: 256
      timeout_s: 180
    encoded_behaviours: []
    token_budget: 40000
