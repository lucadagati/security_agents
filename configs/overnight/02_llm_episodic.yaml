# Overnight LLM B4: episodic adaptation.
name: overnight_llm_episodic
description: 1A+1D episodic LLM (B4). Volume model on L40.
seed: 302
episodes: 12
max_turns: 16
output_dir: runs/overnight
environment: { backend: sim, hosts: 3, vulnerabilities_per_host: 2 }
interaction: { topology: none, communication: none }
agents:
  - id_prefix: attacker
    role: attacker
    adaptation: episodic
    policy: { kind: llm }
    llm:
      provider: ollama
      model: qwen2.5:14b
      temperature: 0.4
      max_tokens: 256
      timeout_s: 180
    encoded_behaviours: []
    token_budget: 40000
  - id_prefix: defender
    role: defender
    adaptation: episodic
    policy: { kind: llm }
    llm:
      provider: ollama
      model: qwen2.5:14b
      temperature: 0.4
      max_tokens: 256
      timeout_s: 180
    encoded_behaviours: []
    token_budget: 40000
