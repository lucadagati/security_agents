# Heuristic attacker vs LLM defender.
name: overnight_heur_att_llm_def
description: Persistent heuristic attacker vs persistent LLM defender.
seed: 305
episodes: 16
max_turns: 16
output_dir: runs/overnight
environment: { backend: sim, hosts: 3, vulnerabilities_per_host: 2 }
interaction: { topology: none, communication: none }
agents:
  - id_prefix: attacker
    role: attacker
    adaptation: persistent
    policy: { kind: heuristic, stealth: 0.3 }
    encoded_behaviours: [reconnaissance, privilege_escalation, resource_targeting]
  - id_prefix: defender
    role: defender
    adaptation: persistent
    policy: { kind: llm }
    llm:
      provider: ollama
      model: qwen2.5:14b
      temperature: 0.4
      max_tokens: 256
      timeout_s: 180
    encoded_behaviours: []
    token_budget: 50000
